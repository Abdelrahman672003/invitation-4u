# Production stack on ONE network: web (nginx) -> api -> db (MySQL), plus a backup job.
# Only `web` publishes a port (80, plain http). Everything else is reachable from inside the network only.
# The database lives in the `db-data` volume, uploads in `app-data`, and `backup` dumps the database
# every day into the `backups` volume. See docs/deployment.md.
name: invite

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER and MYSQL_PASSWORD come from .env.production.
    env_file: .env.production
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    networks: [invite]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: .env.production
    environment:
      UPLOAD_DIR: /data/uploads
      # One proxy in front of the API: the nginx in the web container.
      TRUST_PROXY: "1"
    depends_on:
      db: { condition: service_healthy }
    networks: [invite]
    volumes:
      - app-data:/data
  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    networks: [invite]
    # The only port the server exposes. Change the left side (WEB_PORT) to serve on another port.
    ports: ["${WEB_PORT:-80}:80"]
  backup:
    build: { context: ., target: backup }
    restart: unless-stopped
    env_file: .env.production
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    depends_on:
      db: { condition: service_healthy }
    networks: [invite]
    volumes:
      - app-data:/data:ro
      - backups:/backups

networks:
  invite:
    name: invite

volumes:
  db-data:
  app-data:
  backups:
