name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:invite@127.0.0.1:3306/invite
      TEST_DATABASE_URL: mysql://root:invite@127.0.0.1:3306/invite_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: invite
          MYSQL_DATABASE: invite
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pinvite --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: mysql -h 127.0.0.1 -uroot -pinvite -e "CREATE DATABASE IF NOT EXISTS invite_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - run: npx prisma generate
      - run: npx prisma validate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api -t invite-api .
      - name: Build web image
        run: docker build --target web -t invite-web .
      - name: Build backup image
        run: docker build --target backup -t invite-backup .

  # Staging deploy, smoke tests and gated production deploy are added once a
  # hosting target is chosen (see docs/deployment.md).
