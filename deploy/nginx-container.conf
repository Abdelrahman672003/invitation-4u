# The single entry point of the stack: serves the built web app and forwards /api and /health to the API
# over the stack's private network, so the session cookie stays same-site. Plain http on port 80.
# Link-preview crawlers (WhatsApp, Facebook, Telegram, ...) do not run scripts, so they get a small
# page with the invitation's title and picture instead of the empty single-page app.
map $http_user_agent $link_preview_bot {
  default 0;
  ~*(whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|linkedinbot|slackbot|skypeuripreview|discordbot) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 4m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:4000;
  }

  # Hashed build assets can be cached for a year; index.html must always be revalidated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/i/([^/]+)$ {
    if ($link_preview_bot) {
      rewrite ^/i/(.+)$ /api/v1/public/share/$1 last;
    }
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
}
