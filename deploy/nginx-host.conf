# nginx installed on the server itself (not in Docker). Save as /etc/nginx/sites-available/invite,
# replace example.com, link it into sites-enabled, then let certbot add HTTPS:
#   sudo certbot --nginx -d example.com
# Certbot adds the port 443 block and the redirect from http to https by itself.
server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  client_max_body_size 4m;

  location / {
    # The `web` container, published on localhost only (WEB_PORT, default 8080).
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Tells the app the visitor used https: the session cookie is Secure and depends on it.
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
